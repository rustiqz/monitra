[workspace]
# Crates are internal to the monitra product — not published to crates.io.
publish = false
# No GitHub Releases for the 12 internal crates — they only exist to compose
# the single monitra binary (P2), nobody consumes an individual crate's
# release notes. `monitra` is the only package that overrides this back to
# true below; its release is the one that represents the shippable product,
# and its notes carry a table of every crate's current version (see the
# release-plz.yml CI step that appends it) so the whole picture is visible
# from one place without needing a release per internal crate.
git_release_enable = false
changelog_update = true
# cargo-semver-checks needs a published baseline to diff against. Since we
# never publish, release-plz falls back to querying crates.io by crate name —
# which is actively dangerous with a common name like `models`: it picked up
# an unrelated public crate (`models` v0.1.3, depends on sqlx) and failed the
# release-pr job trying to build it. Semver-checking is meaningless for
# crates we don't publish; disable it outright rather than rename crates
# around a checker that shouldn't be running.
semver_check = false

# Widens `cargo update` to touch all of Cargo.lock, not just workspace
# members, when a release-pr runs.
dependencies_update = true

# NOTE 2026-09-17: `monitra`'s version does NOT auto-cascade when an
# unrelated internal crate (e.g. `models`) changes, and this is not
# fixable via config. It was briefly attempted via `git_only = true`
# (which lets release-plz treat a versionless path dependency as
# significant, per its own source), but `git_only`'s content-diffing
# always shells out to a real `cargo package`, which always resolves
# named dependencies against the live crates.io registry — a path
# override doesn't apply there, because `cargo package` simulates what
# publishing would do. That fails no matter what a path dependency's
# `version` field says, because none of these 13 crates are ever
# actually published (`publish = false`, ADR-005/007) — renaming to
# avoid a crates.io name collision (8 of the 13 short names collide
# with unrelated real crates) does not help, since an unpublished
# dependency fails resolution either way. Do not re-enable `git_only`
# without solving that first. `monitra`'s version moves only on commits
# that touch it directly; the component-version table in its release
# notes is what stays fully informative regardless.
[[package]]
name = "monitra"
publish = false
git_release_enable = true
