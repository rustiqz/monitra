name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # No Cargo.toml exists yet (pre-Phase 1). Skip cargo steps rather than
      # fail every PR until the workspace lands — dep-check still runs below,
      # it already no-ops cleanly when crates/ doesn't exist.
      - name: Detect workspace
        id: workspace
        run: |
          if [ -f Cargo.toml ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Cargo.toml yet (pre-Phase 1) — skipping cargo checks for this PR."
          fi

      - name: Cache cargo
        if: steps.workspace.outputs.exists == 'true'
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt --check
        if: steps.workspace.outputs.exists == 'true'
        run: cargo fmt --all --check

      - name: cargo clippy -D warnings
        if: steps.workspace.outputs.exists == 'true'
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test --workspace
        if: steps.workspace.outputs.exists == 'true'
        run: cargo test --workspace

      # §11.9 — ten-plus crates behind cargo features means combinations
      # nobody builds stop compiling silently. Required from Phase 3 onward.
      - name: cargo build --no-default-features (§11.9 feature matrix)
        if: steps.workspace.outputs.exists == 'true'
        run: cargo build --workspace --no-default-features

      - name: cargo build --all-features (§11.9 feature matrix)
        if: steps.workspace.outputs.exists == 'true'
        run: cargo build --workspace --all-features

      - name: cargo build each provider feature alone (§11.9 feature matrix)
        if: steps.workspace.outputs.exists == 'true'
        run: |
          for feature in postgres redis slack kubernetes; do
            echo "::group::--features $feature"
            cargo build --workspace --no-default-features --features "$feature"
            echo "::endgroup::"
          done

      # Phase 12 (§8, §11.13): the default build's size was a claim, never
      # measured against the surface ADR-008/009/011 added. Report it every
      # PR rather than assume the original figure still holds.
      - name: cargo build --release, report default binary size (§11.13)
        if: steps.workspace.outputs.exists == 'true'
        run: |
          cargo build --release
          size=$(stat -c%s target/release/monitra)
          mb=$(awk "BEGIN { printf \"%.1f\", $size / 1048576 }")
          echo "::notice::Default release binary: ${mb} MB (${size} bytes) — budget is <25MB stripped (§1.5/§8)"

      # Phase 12 (§11.6, §12): a real static binary, not an assumption —
      # `rusqlite`'s `bundled` feature compiles SQLite from C source, which
      # needs a musl C cross-compiler (`musl-tools`), not just the Rust target.
      - name: Install musl toolchain
        if: steps.workspace.outputs.exists == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          rustup target add x86_64-unknown-linux-musl

      - name: cargo build --release --target x86_64-unknown-linux-musl (§12 static build)
        if: steps.workspace.outputs.exists == 'true'
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Verify the musl binary is actually static (§12 gate)
        if: steps.workspace.outputs.exists == 'true'
        run: |
          bin=target/x86_64-unknown-linux-musl/release/monitra
          echo "ldd: $(ldd "$bin" 2>&1)"
          if readelf -d "$bin" 2>/dev/null | grep -q NEEDED; then
            echo "::error::$bin links against a shared library — not fully static"
            readelf -d "$bin"
            exit 1
          fi
          "$bin" --version

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: dep-check (DESIGN.md 3.2 dependency DAG)
        run: python3 scripts/dep-check.py
