name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# The old single `ci` job ran every check in sequence. These run in parallel and
# the final `ci` job aggregates them, so the check name branch protection and
# the release workflow's gate see ("ci") is unchanged. `ci` is the only job a
# ruleset needs to require for these; add a job to `needs:` when adding one here.
jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: cargo fmt --check
        run: cargo fmt --all --check

      - name: cargo clippy -D warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: cargo test --workspace
        run: cargo test --workspace

  # §11.9 — build supported provider feature combinations so they do not rot.
  features:
    name: features
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: cargo build --no-default-features (§11.9 feature matrix)
        run: cargo build --workspace --no-default-features

      - name: cargo build --all-features (§11.9 feature matrix)
        run: cargo build --workspace --all-features

      - name: cargo build each provider feature alone (§11.9 feature matrix)
        run: |
          for feature in slack kubernetes; do
            echo "::group::--features $feature"
            cargo build --workspace --no-default-features --features "$feature"
            echo "::endgroup::"
          done

  # Phase 12 (§8, §11.13): the default build's size was a claim, never
  # measured against the surface ADR-008/009/011 added. Report it every
  # PR rather than assume the original figure still holds.
  release-size:
    name: release-size
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: cargo build --release, report default binary size (§11.13)
        run: |
          cargo build --release
          size=$(stat -c%s target/release/monitra)
          mb=$(awk "BEGIN { printf \"%.1f\", $size / 1048576 }")
          echo "::notice::Default release binary: ${mb} MB (${size} bytes) — budget is <25MB stripped (§1.5/§8)"

  # Phase 12 (§11.6, §12): a real static binary, not an assumption —
  # `rusqlite`'s `bundled` feature compiles SQLite from C source, which
  # needs a musl C cross-compiler (`musl-tools`), not just the Rust target.
  static:
    name: static
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          rustup target add x86_64-unknown-linux-musl

      - name: cargo build --release --target x86_64-unknown-linux-musl (§12 static build)
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: cargo build --release --target x86_64-unknown-linux-musl

      - name: Verify the musl binary is actually static (§12 gate)
        run: |
          bin=target/x86_64-unknown-linux-musl/release/monitra
          echo "ldd: $(ldd "$bin" 2>&1)"
          if readelf -d "$bin" 2>/dev/null | grep -q NEEDED; then
            echo "::error::$bin links against a shared library — not fully static"
            readelf -d "$bin"
            exit 1
          fi
          "$bin" --version

  scripts:
    name: scripts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: dep-check (DESIGN.md 3.2 dependency DAG)
        run: python3 scripts/dep-check.py

      # A broken release script fails on `main` after the merge, when nobody
      # is looking — test it on the PR instead.
      - name: release script tests
        run: python3 -m unittest scripts/test_release.py

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Check install and image preparation scripts
        run: shellcheck scripts/install.sh scripts/prepare-image-context.sh

  # `cargo build` already runs `npm ci && npm run build` through build.rs, so a
  # type error fails the Rust jobs — but nothing linted or tested the dashboard.
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: lint
        run: npm run lint

      - name: test
        run: npm test

      - name: typecheck and build
        run: npm run build

  ci:
    name: ci
    if: always()
    needs: [lint, test, features, release-size, static, scripts, frontend]
    runs-on: ubuntu-latest
    steps:
      # `always()` keeps this running when a needed job fails or is skipped; a
      # skipped dependency must not read as a pass.
      - name: Require every job to have succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for r in $RESULTS; do
            [ "$r" = success ] || { echo "::error::a required CI job did not succeed ($r)"; exit 1; }
          done

  image:
    name: image build (no publish)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download v0.1.0 release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p artifacts
          gh release download v0.1.0 --dir artifacts \
            --pattern 'monitra-v*.tar.gz' --pattern SHA256SUMS

      - name: Prepare verified image context
        run: sh scripts/prepare-image-context.sh artifacts 0.1.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build both platforms without publishing
        run: docker buildx build --platform linux/amd64,linux/arm64 --output type=oci,dest="$RUNNER_TEMP/monitra-image.tar" .

      - name: Run amd64 image
        run: |
          docker buildx build --platform linux/amd64 --load --tag monitra:ci .
          docker run --rm monitra:ci --version

  # Secret scan over the full git history and the checked-out tree. A separate
  # job so it runs in parallel and does not wait on the Rust build. The
  # gitleaks binary is pinned and checksum-verified rather than pulled through
  # a third-party action. Known false positives are listed by exact
  # fingerprint in .gitleaksignore.
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$tarball" "$base/$tarball"
          curl -sSfL -o "$RUNNER_TEMP/checksums.txt" "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          (cd "$RUNNER_TEMP" && grep " $tarball\$" checksums.txt | sha256sum -c -)
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: gitleaks (git history)
        run: gitleaks git --redact --no-banner --verbose .

      - name: gitleaks (working tree)
        run: gitleaks dir --redact --no-banner --verbose .

  supply-chain:
    name: supply-chain
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check dependency licenses, advisories, and duplicates
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check
          command-arguments: advisories bans licenses

      - name: Audit RustSec advisories
        uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
