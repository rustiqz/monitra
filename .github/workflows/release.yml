name: Release

# Gated on CI having passed on the exact commit on `main` (not just on the PR
# branch before merge). No release PR: a merged PR whose title implies a bump
# is versioned, tagged and published straight from here (scripts/release.py).
on:
  workflow_dispatch:
    inputs:
      version:
        description: Existing release version to publish as an image (for example 0.1.0)
        required: true
        type: string
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

# Read-only by default: the version commit/tag push and the release creation
# authenticate with RELEASE_PLZ_TOKEN, not GITHUB_TOKEN.
permissions:
  contents: read

# Serialised so two quick merges can't race on the version commit or the tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success'
    outputs:
      released: ${{ steps.plan.outputs.released }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: main
          # A PAT (or app token) that is allowed to bypass branch protection:
          # the version commit goes straight to `main`, and the default
          # GITHUB_TOKEN can neither bypass it nor trigger follow-up workflows.
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}

      # CI ran against `head_sha`. If `main` has moved on, the newer commit
      # has its own CI run and therefore its own release run; releasing from
      # here would tag a commit CI has not vouched for.
      - name: Skip if main moved past the commit CI tested
        id: fresh
        run: |
          if [ "$(git rev-parse HEAD)" != "${{ github.event.workflow_run.head_sha }}" ]; then
            echo "::notice::main moved past ${{ github.event.workflow_run.head_sha }}; the newer run will release."
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.fresh.outputs.stale != 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install Rust toolchain
        if: steps.fresh.outputs.stale != 'true'
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable

      - name: Plan release from merged PR titles
        id: plan
        if: steps.fresh.outputs.stale != 'true'
        run: python3 scripts/release.py plan --notes "$RUNNER_TEMP/release-notes.md"

      - name: Apply, commit, tag, push
        if: steps.plan.outputs.released == 'true'
        run: |
          set -euo pipefail
          version="${{ steps.plan.outputs.version }}"
          python3 scripts/release.py apply "$version" --notes "$RUNNER_TEMP/release-notes.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Every crate inherits the workspace version, so the lockfile entries
          # for all of them move too. Workspace-only: external deps stay put.
          cargo update --workspace
          git add Cargo.toml Cargo.lock CHANGELOG.md
          # `[skip ci]` plus the script ignoring `chore(release)` commits keeps
          # this from ever triggering itself.
          git commit -m "chore(release): v${version} [skip ci]"
          git tag "v${version}"
          # Atomic: either both the commit and the tag land, or neither does.
          git push --atomic origin HEAD:main "v${version}"

      - name: Keep release notes for the publish job
        if: steps.plan.outputs.released == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes.md

  build:
    name: build (${{ matrix.target }})
    needs: version
    if: needs.version.outputs.released == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: v${{ needs.version.outputs.version }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      # crates/backend/build.rs runs `npm ci && npm run build` (CLAUDE.md
      # toolchain note) — Node is a build prerequisite, pinned here rather
      # than trusting whatever the runner image ships.
      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"

      # rusqlite's `bundled` feature compiles SQLite from C, which needs a
      # musl C compiler, not just the Rust target (see ci.yml).
      - name: Install musl toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Build static release binary
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
          CC_aarch64_unknown_linux_musl: musl-gcc
        run: cargo build --release --locked --target ${{ matrix.target }}

      # Same gate ci.yml applies: a "static" asset that links a shared
      # library would fail on exactly the minimal hosts people use it on.
      - name: Verify the binary is static and reports the release version
        run: |
          bin=target/${{ matrix.target }}/release/monitra
          if readelf -d "$bin" 2>/dev/null | grep -q NEEDED; then
            echo "::error::$bin links against a shared library — not fully static"
            exit 1
          fi
          # Only the x86_64 binary can run on an x86_64 runner and vice versa,
          # and each matrix leg runs on its own architecture.
          "$bin" --version | tee version.txt
          grep -q "${{ needs.version.outputs.version }}" version.txt

      - name: Package
        run: |
          name="monitra-v${{ needs.version.outputs.version }}-${{ matrix.target }}"
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/monitra" LICENSE-MIT LICENSE-APACHE README.md "$name/"
          tar -czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"

      - name: Upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist-${{ matrix.target }}
          path: monitra-v*

  publish:
    name: publish GitHub Release
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="v${{ needs.version.outputs.version }}"
          cat artifacts/monitra-v*.sha256 > artifacts/SHA256SUMS
          gh release create "$tag" \
            --title "$tag" \
            --notes-file artifacts/release-notes.md \
            artifacts/monitra-v*.tar.gz artifacts/SHA256SUMS

  image:
    name: publish GHCR image
    needs: [version, build, publish]
    if: >-
      always() && (github.event_name == 'workflow_dispatch' ||
      (needs.version.outputs.released == 'true' && needs.build.result == 'success' && needs.publish.result == 'success'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || needs.version.outputs.version }}
    steps:
      - name: Check out image files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # v0.1.0 predates the Dockerfile; dispatch uses current main.
          ref: ${{ github.event_name == 'workflow_dispatch' && 'main' || format('v{0}', needs.version.outputs.version) }}

      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must be MAJOR.MINOR.PATCH without a v prefix"
            exit 1
          fi
          mkdir -p artifacts
          gh release download "v${RELEASE_VERSION}" --dir artifacts \
            --pattern 'monitra-v*.tar.gz' --pattern SHA256SUMS

      - name: Prepare verified image context
        run: sh scripts/prepare-image-context.sh artifacts "$RELEASE_VERSION"

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Select image tags
        id: tags
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tags="ghcr.io/${GH_REPO}:v${RELEASE_VERSION}"
          latest=$(gh api "repos/${GH_REPO}/releases/latest" --jq .tag_name)
          if [ "$latest" = "v${RELEASE_VERSION}" ]; then
            tags="${tags},ghcr.io/${GH_REPO}:latest"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - name: Build and publish both architectures
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
