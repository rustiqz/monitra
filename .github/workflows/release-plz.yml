name: Release-plz

permissions:
  contents: write
  pull-requests: write

# Gated on the CI workflow, not a bare push — release-plz must never publish
# or open a release PR off a commit that hasn't passed `ci` on `main` itself
# (as opposed to just having passed on a PR branch before merge). `branches`
# here filters by the branch CI ran against; the job-level `if` below also
# checks the triggering event was a `push` (not a `pull_request` CI run) and
# that CI actually succeeded.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  # Tags + publishes a GitHub Release for any crate whose version bump was
  # already merged to main via a release-plz PR.
  release-plz-release:
    name: Release-plz release
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # The branch name, not `head_sha` — checking out a bare SHA leaves
          # the runner in detached HEAD, and release-plz shells out to `git
          # rev-parse --abbrev-ref @{upstream}` internally, which fails with
          # "HEAD does not point to a branch" when detached. Safe to name the
          # branch directly: the trigger's own `branches: [main]` filter plus
          # the `event == 'push'` check below already guarantee this is main.
          ref: ${{ github.event.workflow_run.head_branch }}
          # A PAT, not the default GITHUB_TOKEN: PRs/pushes made with the
          # default token don't trigger other pull_request workflows (GitHub's
          # anti-recursion rule), which would mean release-plz's own PR could
          # never pick up a passing `ci` check to satisfy branch protection.
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}

      # No Cargo.toml exists yet (pre-Phase 1) — release-plz has nothing to
      # read metadata from and hard-fails otherwise. Skip until the workspace
      # lands, same guard as ci.yml.
      - name: Detect workspace
        id: workspace
        run: |
          if [ -f Cargo.toml ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Cargo.toml yet (pre-Phase 1) — skipping release-plz."
          fi

      - name: Install Rust toolchain
        if: steps.workspace.outputs.exists == 'true'
        uses: dtolnay/rust-toolchain@stable
      - name: Run release-plz release
        id: release-plz-release
        if: steps.workspace.outputs.exists == 'true'
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}

      # release-plz's own release body is just that one crate's changelog
      # (its Tera template has no access to sibling packages' versions). The
      # `monitra` release is the one that represents the shippable product
      # (release-plz.toml's dependencies_update comment), so enrich only that
      # one release with a full crate-version table — the other 12 per-crate
      # releases stay exactly as release-plz produces them.
      - name: Add component version table to monitra release
        if: >-
          steps.workspace.outputs.exists == 'true' &&
          steps.release-plz-release.outputs.releases_created == 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          RELEASES_JSON: ${{ steps.release-plz-release.outputs.releases }}
        run: |
          set -euo pipefail
          tag=$(echo "$RELEASES_JSON" | jq -r '.[] | select(.package_name=="monitra") | .tag')
          if [ -z "$tag" ]; then
            echo "monitra was not part of this release batch; nothing to enrich."
            exit 0
          fi

          table=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages | sort_by(.name)
                | ["| Crate | Version |", "|---|---|"] + (map("| " + .name + " | " + .version + " |"))
                | .[]')

          body=$(gh release view "$tag" --json body -q .body)
          printf '%s\n\n## Component versions\n\n%s\n' "$body" "$table" > release-notes.md
          gh release edit "$tag" --notes-file release-notes.md

  # Opens or updates the aggregated "chore: release" PR with computed version
  # bumps + changelogs. This PR goes through the same branch protection as
  # any other — merging it is what actually ships a release.
  release-plz-pr:
    name: Release-plz PR
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success'
    concurrency:
      group: release-plz-pr-${{ github.event.workflow_run.head_branch }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # See the comment on the same option in the release-plz-release job.
          ref: ${{ github.event.workflow_run.head_branch }}
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}

      - name: Detect workspace
        id: workspace
        run: |
          if [ -f Cargo.toml ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Cargo.toml yet (pre-Phase 1) — skipping release-plz."
          fi

      - name: Install Rust toolchain
        if: steps.workspace.outputs.exists == 'true'
        uses: dtolnay/rust-toolchain@stable
      - name: Run release-plz release-pr
        id: release-plz-pr
        if: steps.workspace.outputs.exists == 'true'
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}

      # `monitra`'s own version does not cascade when an internal crate
      # changes (release-plz.toml's dated NOTE explains why `git_only` can't
      # fix this: it always shells out to `cargo package`, which resolves
      # named deps against the real crates.io registry even for path
      # overrides, and none of these 13 crates are ever actually published).
      # Patches the gap instead of the root cause: if this PR moves any
      # component other than `monitra`, and release-plz didn't already
      # decide to move `monitra` itself (e.g. from a commit touching it
      # directly), bump `monitra`'s patch version too, so the one release
      # that represents the shippable product keeps moving.
      #
      # Idempotent by construction rather than by tracking prior runs: the
      # target is always "the last real monitra-v* tag, patch + 1", and the
      # step no-ops once Cargo.toml already reads that value — safe whether
      # release-plz fully regenerates this PR branch on every rerun or
      # amends it incrementally, since either way re-running this step
      # converges to the same target instead of compounding.
      - name: Cascade monitra's version when another component bumps
        if: steps.workspace.outputs.exists == 'true' && steps.release-plz-pr.outputs.prs_created == 'true'
        env:
          PR_JSON: ${{ steps.release-plz-pr.outputs.pr }}
          GH_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
        run: |
          set -euo pipefail

          any_other_bump=false
          monitra_already_moving=false
          while IFS=$'\t' read -r name version; do
            tag="${name}-v${version}"
            if git rev-parse "refs/tags/$tag" >/dev/null 2>&1; then
              continue  # this package's proposed version is already released — unchanged
            fi
            if [ "$name" = "monitra" ]; then
              monitra_already_moving=true
            else
              any_other_bump=true
            fi
          done < <(echo "$PR_JSON" | jq -r '.releases[] | "\(.package_name)\t\(.version)"')

          if [ "$any_other_bump" != "true" ] || [ "$monitra_already_moving" = "true" ]; then
            echo "Nothing to cascade: no other component is moving, or monitra already is."
            exit 0
          fi

          last_tag=$(git tag --list 'monitra-v*' --sort=-v:refname | head -n1)
          last_version=${last_tag#monitra-v}
          IFS=. read -r major minor patch <<<"$last_version"
          target="$major.$minor.$((patch + 1))"

          branch=$(echo "$PR_JSON" | jq -r '.head_branch')
          pr_number=$(echo "$PR_JSON" | jq -r '.number')
          git fetch origin "$branch"
          git checkout "$branch"

          current=$(awk -F'"' '/^version = /{print $2; exit}' Cargo.toml)
          if [ "$current" = "$target" ]; then
            echo "monitra already at cascade target $target; nothing to do."
            exit 0
          fi

          python3 scripts/cascade-monitra-version.py "$target"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock
          git commit -m "chore: bump monitra to $target (cascaded from component release)"
          git push origin "$branch"
          gh pr comment "$pr_number" --body "Cascaded: bumped \`monitra\` $current -> $target since this PR moves at least one internal crate."
