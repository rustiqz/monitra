[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
# The one product version, written by scripts/release.py on each release. Every
# crate inherits it so `monitra --version` (clap reads monitra-cli's own
# version) and the release tag can never disagree.
version = "0.1.2"
edition = "2024"
license = "MIT OR Apache-2.0"

# §8 / §11.6 (Phase 12): size-optimised release build. `panic = "unwind"`
# is kept explicit (not the profile default of omitting it, which is also
# "unwind") to record the decision: §7.2 promises a probe panic is caught
# per-task and recorded as an internal error rather than taking down the
# whole daemon, and that only holds under unwind. See DESIGN.md §11.6/ADR.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "unwind"

[package]
name = "monitra"
version.workspace = true
license.workspace = true
repository = "https://github.com/rustiqz/monitra"
edition.workspace = true

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-{ target }.tar.gz"
bin-dir = "{ name }-v{ version }-{ target }/{ bin }"
pkg-fmt = "tgz"
disabled-strategies = ["quick-install", "compile"]

[package.metadata.binstall.overrides.x86_64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-x86_64-unknown-linux-musl.tar.gz"
bin-dir = "{ name }-v{ version }-x86_64-unknown-linux-musl/{ bin }"

[package.metadata.binstall.overrides.aarch64-unknown-linux-gnu]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-v{ version }-aarch64-unknown-linux-musl.tar.gz"
bin-dir = "{ name }-v{ version }-aarch64-unknown-linux-musl/{ bin }"

[[bin]]
name = "monitra"
path = "src/main.rs"

# Always-compiled defaults: SQLite Store (`monitra-storage`) and webhook Notifier
# (`notify-webhook`, logs when no target is configured — DESIGN.md §4.1).
# Wired from Phase 3 onward. Slack and Kubernetes are optional/feature-gated.
[dependencies]
monitra-cli = { path = "crates/cli" }
monitra-provider = { path = "crates/provider" }
monitra-storage = { path = "crates/storage" }
monitra-backend = { path = "crates/backend" }
monitra-engine = { path = "crates/engine" }
monitra-agent = { path = "crates/agent" }
monitra-tui = { path = "crates/tui" }
notify-webhook = { path = "crates/notify-webhook" }
clap = "=4.6.7"
axum = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "signal"] }
notify-slack = { path = "crates/notify-slack", optional = true }
collector-kubernetes = { path = "crates/collector-kubernetes", optional = true }

[features]
slack = ["dep:notify-slack"]
kubernetes = ["dep:collector-kubernetes"]

# §6.4 falsification harness (tests/scale.rs) only — needs a real SqliteStore
# and a real EngineHandle end to end, which `monitra-engine`'s own dev-deps
# can never have (dep-check forbids it depending on `monitra-storage`). Only
# the root binary is allowed to know about both.
[dev-dependencies]
async-trait = "0.1"
tempfile = "3"
libc = "0.2"
monitra-models = { path = "crates/models" }
tokio = { version = "1", features = ["time", "net", "sync", "macros"] }
