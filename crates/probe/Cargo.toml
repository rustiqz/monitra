[package]
name = "monitra-probe"
version = "0.0.1"
edition.workspace = true

[dependencies]
monitra-models = { path = "../models" }
tokio = { version = "1", features = ["rt", "time", "net"] }
tracing = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
surge-ping = "0.8"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
