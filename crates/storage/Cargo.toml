[package]
name = "monitra-storage"
version = "0.0.1"
edition.workspace = true

[dependencies]
monitra-models = { path = "../models" }
monitra-provider = { path = "../provider" }
async-trait = "0.1"
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"
tokio = { version = "1", features = ["rt"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
