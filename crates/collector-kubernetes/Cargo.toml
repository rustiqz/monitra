[package]
name = "collector-kubernetes"
version = "0.0.1"
edition.workspace = true

[dependencies]
monitra-models = { path = "../models" }
monitra-provider = { path = "../provider" }
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
base64 = "0.22"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
