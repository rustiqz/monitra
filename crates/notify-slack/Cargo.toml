[package]
name = "notify-slack"
version = "0.0.1"
edition.workspace = true

[dependencies]
monitra-provider = { path = "../provider" }
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
